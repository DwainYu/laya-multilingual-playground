[project]
name = "laya-multilingual-playground"
version = "0.1.0"
description = "Minimal reproducible WSL experiment: ModelScope -> Laya Multilingual -> typed Chinese decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "laya>=0.3.4",
    "modelscope>=1.40.1",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_play"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CPU-only torch: this experiment targets WSL + CPU (see README "Runtime").
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
